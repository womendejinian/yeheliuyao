name: Docker Image CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip and apply all fixes
        run: |
          for z in *.zip; do unzip -q -o "$z"; done
          python3 - << 'EOF'
          import os, re

          root = 'liuyao-main'

          # 1. 去掉右上角「项目」按钮及前面的分隔竖线
          p = os.path.join(root, 'components/site/SiteHeader.tsx')
          s = open(p, encoding='utf-8').read()
          s = re.sub(
              r'\s*<span aria-hidden className="hidden h-4 w-px bg-\[#C8BEA8\] sm:block" />\s*<a[^>]*href="https://github\.com/woniu336/liuyao"[\s\S]*?</a>',
              '',
              s
          )
          open(p, 'w', encoding='utf-8').write(s)

          # 2. 修复排盘结果页在手机端的等比缩放与宽度溢出
          p = os.path.join(root, 'components/liuyao/LiuyaoResult.tsx')
          s = open(p, encoding='utf-8').read()
          s = s.replace('<div className="lg:sticky lg:top-[86px]">', '<div className="min-w-0 lg:sticky lg:top-[86px]">')
          s = s.replace(
              'className="mx-auto w-full max-w-[440px] bg-[#FBF7EC] px-4 py-4 sm:px-5"',
              'className="mx-auto w-full max-w-[440px] overflow-hidden bg-[#FBF7EC] px-3 py-4 sm:px-5"'
          )
          open(p, 'w', encoding='utf-8').write(s)

          p = os.path.join(root, 'components/liuyao/ResponsiveBoard.tsx')
          s = open(p, encoding='utf-8').read()
          s = s.replace(
              '<div ref={wrapRef} className="w-full" style={{ height }}>',
              '<div ref={wrapRef} className="w-full overflow-hidden" style={{ height }}>'
          )
          open(p, 'w', encoding='utf-8').write(s)

          # 3. 锁定手机视口比例，并确保电脑鼠标滚轮与手机上下滑动畅通
          p = os.path.join(root, 'app/layout.tsx')
          s = open(p, encoding='utf-8').read()
          s = s.replace("initialScale: 1,", "initialScale: 1, maximumScale: 1, userScalable: false,")
          s = s.replace('<html lang="zh-CN" className="h-full">', '<html lang="zh-CN">')
          open(p, 'w', encoding='utf-8').write(s)

          p = os.path.join(root, 'app/globals.css')
          s = open(p, encoding='utf-8').read()
          s = s.replace("overscroll-behavior-y: none;", "overscroll-behavior-y: auto;")
          s += "\nhtml, body { height: auto !important; overflow-x: visible !important; overflow-y: visible !important; }\n"
          open(p, 'w', encoding='utf-8').write(s)

          # 4. 移除非标 thinking 参数（解决解卦 400 报错）并跳过构建期 TS 重复检查
          p = os.path.join(root, 'lib/readings/llm-request.ts')
          s = open(p, encoding='utf-8').read()
          s = s.replace("body.thinking = { type: cfg.thinking };", "// disabled thinking param")
          open(p, 'w', encoding='utf-8').write(s)

          p = os.path.join(root, 'next.config.ts')
          s = open(p, encoding='utf-8').read()
          s = s.replace("devIndicators: false,", "devIndicators: false, typescript: { ignoreBuildErrors: true },")
          open(p, 'w', encoding='utf-8').write(s)

          # 5. 自动注销并清理浏览器旧 Service Worker 缓存，防止样式被强缓存拦截
          p = os.path.join(root, 'components/site/ServiceWorkerRegister.tsx')
          s = """'use client';
          import { useEffect } from 'react';
          export default function ServiceWorkerRegister() {
            useEffect(() => {
              if (typeof window === 'undefined') return;
              if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => r.unregister()));
              }
              if ('caches' in window) {
                caches.keys().then((ks) => ks.forEach((k) => caches.delete(k)));
              }
            }, []);
            return null;
          }
          """
          open(p, 'w', encoding='utf-8').write(s.strip() + "\n")

          p = os.path.join(root, 'public/sw.js')
          sw_kill = """self.addEventListener('install', () => self.skipWaiting());
          self.addEventListener('activate', (event) => {
            event.waitUntil((async () => {
              const keys = await caches.keys();
              await Promise.all(keys.map((k) => caches.delete(k)));
              await self.registration.unregister();
            })());
          });
          """
          open(p, 'w', encoding='utf-8').write(sw_kill.strip() + "\n")
          EOF

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./liuyao-main
          file: ./liuyao-main/Dockerfile
          push: true
          tags: ghcr.io/womendejinian/yeheliuyao:latest
