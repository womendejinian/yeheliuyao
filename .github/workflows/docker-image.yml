name: Docker Image CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull source code and apply Docker patches
        run: |
          if [ ! -f "package.json" ]; then
            git clone https://github.com/woniu336/liuyao.git /tmp/liuyao-src
            cd /tmp/liuyao-src
            git checkout e95ff9d61c552d05c803763f70ec0b7b579e5e65 || true
            rm -rf .git
            cp -a /tmp/liuyao-src/. "$GITHUB_WORKSPACE/"
            cd "$GITHUB_WORKSPACE"
          fi

          cat << 'EOF' > lib/db/runtime.ts
          import type { D1Like, D1PreparedStatement, D1Result } from './d1-types';

          export interface RuntimeEnv {
            DB?: unknown;
            [key: string]: unknown;
          }

          const GLOBAL_DB_KEY = '__liuyao_node_sqlite_d1__';

          async function getNodeSqliteD1(): Promise<D1Like | null> {
            const g = globalThis as Record<string, unknown>;
            if (g[GLOBAL_DB_KEY]) return g[GLOBAL_DB_KEY] as D1Like;

            if (typeof process === 'undefined' || !process.versions?.node) return null;
            const dbPath = process.env.SQLITE_DB_PATH?.trim() || '';
            if (!dbPath) return null;

            try {
              const sqliteSpec = ['node', 'sqlite'].join(':');
              const fsSpec = ['node', 'fs'].join(':');
              const pathSpec = ['node', 'path'].join(':');

              const sqliteMod = (await import(/* webpackIgnore: true */ /* @vite-ignore */ sqliteSpec)) as any;
              const fsMod = (await import(/* webpackIgnore: true */ /* @vite-ignore */ fsSpec)) as any;
              const pathMod = (await import(/* webpackIgnore: true */ /* @vite-ignore */ pathSpec)) as any;

              if (dbPath !== ':memory:') {
                fsMod.mkdirSync(pathMod.dirname(dbPath), { recursive: true });
              }
              const rawDb = new sqliteMod.DatabaseSync(dbPath);
              rawDb.exec('PRAGMA journal_mode = WAL;');
              rawDb.exec('PRAGMA busy_timeout = 5000;');

              const adapter: D1Like = {
                prepare(sql: string): D1PreparedStatement {
                  let boundValues: unknown[] = [];
                  const stmt: D1PreparedStatement = {
                    bind(...values: unknown[]): D1PreparedStatement {
                      boundValues = values.map((v) => (v === undefined ? null : v));
                      return stmt;
                    },
                    async run(): Promise<unknown> {
                      return rawDb.prepare(sql).run(...boundValues);
                    },
                    async all<T = Record<string, unknown>>(): Promise<D1Result<T>> {
                      const rows = rawDb.prepare(sql).all(...boundValues) as T[];
                      return { results: rows, success: true };
                    },
                    async first<T = unknown>(): Promise<T | null> {
                      const row = rawDb.prepare(sql).get(...boundValues) as T | undefined;
                      return row ?? null;
                    },
                  };
                  return stmt;
                },
              };

              g[GLOBAL_DB_KEY] = adapter;
              return adapter;
            } catch (e) {
              console.warn('[db] Node SQLite init failed:', e);
              return null;
            }
          }

          export async function getRuntimeEnv(): Promise<RuntimeEnv | null> {
            try {
              const specifier = 'cloudflare:workers';
              const mod = (await import(/* webpackIgnore: true */ /* @vite-ignore */ specifier)) as {
                env?: RuntimeEnv;
              };
              if (mod?.env) return mod.env;
            } catch {}

            const sqliteDb = await getNodeSqliteD1();
            if (sqliteDb) return { DB: sqliteDb };

            return null;
          }
          EOF

          node -e '
          const fs = require("node:fs");
          for (const file of ["app/api/read/route.ts", "app/api/llm-test/route.ts"]) {
            if (!fs.existsSync(file)) continue;
            const src = fs.readFileSync(file, "utf8");
            const patched = src.replace(
              "return new URL(origin).host !== new URL(req.url).host;",
              "const oh = new URL(origin).host; const fh = (req.headers.get(\"x-forwarded-host\") || \"\").split(\",\")[0].trim(); const hh = req.headers.get(\"host\") || \"\"; return oh !== new URL(req.url).host && oh !== hh && oh !== fh;"
            );
            fs.writeFileSync(file, patched, "utf8");
          }
          const reqFile = "lib/server/request.ts";
          if (fs.existsSync(reqFile)) {
            const reqSrc = fs.readFileSync(reqFile, "utf8");
            fs.writeFileSync(reqFile, reqSrc.replace(
              "return new URL(origin).host === req.headers.get(\x27host\x27);",
              "const oh = new URL(origin).host; const fh = (req.headers.get(\x27x-forwarded-host\x27) || \x27\x27).split(\x27,\x27)[0].trim(); return oh === req.headers.get(\x27host\x27) || oh === fh || oh === new URL(req.url).host;"
            ), "utf8");
          }
          '

          cat << 'EOF' > .dockerignore
          node_modules
          .next
          .vinext
          .git
          .gitignore
          logs
          data
          *.log
          .llm.local
          EOF

          cat << 'EOF' > Dockerfile
          FROM node:22-bookworm-slim AS builder
          WORKDIR /app
          COPY package.json package-lock.json ./
          RUN npm ci
          COPY . .
          ENV NODE_ENV=production
          ENV NEXT_TELEMETRY_DISABLED=1
          RUN npm run build
          RUN rm -rf node_modules/cf node_modules/@cloudflare node_modules/workerd

          FROM node:22-bookworm-slim AS runner
          WORKDIR /app
          ENV NODE_ENV=production
          ENV NEXT_TELEMETRY_DISABLED=1
          ENV PORT=3000
          ENV HOSTNAME=0.0.0.0
          ENV SQLITE_DB_PATH=/app/data/liuyao.db
          RUN mkdir -p /app/data
          COPY --from=builder /app/package.json ./package.json
          COPY --from=builder /app/next.config.ts ./next.config.ts
          COPY --from=builder /app/public ./public
          COPY --from=builder /app/.next ./.next
          COPY --from=builder /app/node_modules ./node_modules
          COPY --from=builder /app/scripts ./scripts
          COPY --from=builder /app/lib/dev ./lib/dev
          COPY --from=builder /app/migrations ./migrations
          EXPOSE 3000
          CMD ["node", "scripts/next.mjs", "start", "-H", "0.0.0.0", "-p", "3000"]
          EOF

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/womendejinian/yeheliuyao:latest
