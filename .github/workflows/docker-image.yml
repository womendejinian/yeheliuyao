name: Docker Image CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip and apply subpath & mobile fixes
        run: |
          for z in *.zip; do unzip -q -o "$z"; done
          python3 - << 'EOF'
          import os, re

          root = 'liuyao-main'
          BASE = '/yeheliuyao'

          # 1. 去掉右上角「项目」按钮
          p = os.path.join(root, 'components/site/SiteHeader.tsx')
          s = open(p, encoding='utf-8').read()
          s = re.sub(
              r'\s*<span aria-hidden className="hidden h-4 w-px bg-\[#C8BEA8\] sm:block" />\s*<a[^>]*href="https://github\.com/woniu336/liuyao"[\s\S]*?</a>',
              '',
              s
          )
          open(p, 'w', encoding='utf-8').write(s)

          # 2. 修复手机端等比缩放与滚动
          p = os.path.join(root, 'components/liuyao/LiuyaoResult.tsx')
          s = open(p, encoding='utf-8').read()
          s = s.replace('<div className="lg:sticky lg:top-[86px]">', '<div className="min-w-0 lg:sticky lg:top-[86px]">')
          s = s.replace(
              'className="mx-auto w-full max-w-[440px] bg-[#FBF7EC] px-4 py-4 sm:px-5"',
              'className="mx-auto w-full max-w-[440px] overflow-hidden bg-[#FBF7EC] px-3 py-4 sm:px-5"'
          )
          open(p, 'w', encoding='utf-8').write(s)

          p = os.path.join(root, 'components/liuyao/ResponsiveBoard.tsx')
          s = open(p, encoding='utf-8').read()
          s = s.replace(
              '<div ref={wrapRef} className="w-full" style={{ height }}>',
              '<div ref={wrapRef} className="w-full overflow-hidden" style={{ height }}>'
          )
          open(p, 'w', encoding='utf-8').write(s)

          p = os.path.join(root, 'app/layout.tsx')
          s = open(p, encoding='utf-8').read()
          s = s.replace("initialScale: 1,", "initialScale: 1, maximumScale: 1, userScalable: false,")
          s = s.replace('<html lang="zh-CN" className="h-full">', '<html lang="zh-CN">')
          open(p, 'w', encoding='utf-8').write(s)

          p = os.path.join(root, 'app/globals.css')
          s = open(p, encoding='utf-8').read()
          s = s.replace("overscroll-behavior-y: none;", "overscroll-behavior-y: auto;")
          s += "\nhtml, body { height: auto !important; overflow-x: visible !important; overflow-y: visible !important; }\n"
          open(p, 'w', encoding='utf-8').write(s)

          # 3. 设置 Next.js basePath 为 /yeheliuyao 并移除非标 thinking 参数
          p = os.path.join(root, 'next.config.ts')
          s = open(p, encoding='utf-8').read()
          s = s.replace(
              "devIndicators: false,",
              f"basePath: '{BASE}', devIndicators: false, typescript: {{ ignoreBuildErrors: true }},"
          )
          open(p, 'w', encoding='utf-8').write(s)

          p = os.path.join(root, 'lib/readings/llm-request.ts')
          s = open(p, encoding='utf-8').read()
          s = s.replace("body.thinking = { type: cfg.thinking };", "// disabled thinking param")
          open(p, 'w', encoding='utf-8').write(s)

          # 4. 将静态资源与 API 请求路径统一加上 /yeheliuyao 前缀
          replacements = {
              'app/globals.css': [("url('/fonts/yehe-brand.woff2')", f"url('{BASE}/fonts/yehe-brand.woff2')")],
              'app/layout.tsx': [("'/icons/", f"'{BASE}/icons/")],
              'app/manifest.ts': [("'/icons/", f"'{BASE}/icons/")],
              'components/liuyao/Coin.tsx': [("'/images/", f"'{BASE}/images/")],
              'components/examples/ExamplesView.tsx': [
                  ("fetch('/data/zengshan-cases.json')", f"fetch('{BASE}/data/zengshan-cases.json')"),
                  ("return `/liuyao?${qs}`;", f"return `{BASE}/liuyao?${{qs}}`;"),
              ],
              'components/liuyao/ReadingPanel.tsx': [("fetch('/api/read'", f"fetch('{BASE}/api/read'")],
              'components/site/SettingsDialog.tsx': [("fetch('/api/llm-test'", f"fetch('{BASE}/api/llm-test'")],
              'lib/store/index.ts': [("fetch('/api/cases?probe=1'", f"fetch('{BASE}/api/cases?probe=1'")],
              'lib/store/remote.ts': [
                  ("'/api/cases'", f"'{BASE}/api/cases'"),
                  ("`/api/cases?", f"`{BASE}/api/cases?"),
              ],
          }
          for rel, pairs in replacements.items():
              fp = os.path.join(root, rel)
              c = open(fp, encoding='utf-8').read()
              for old, new in pairs:
                  c = c.replace(old, new)
              open(fp, 'w', encoding='utf-8').write(c)

          # 5. 注销旧 Service Worker 缓存
          p = os.path.join(root, 'components/site/ServiceWorkerRegister.tsx')
          s = """'use client';
          import { useEffect } from 'react';
          export default function ServiceWorkerRegister() {
            useEffect(() => {
              if (typeof window === 'undefined') return;
              if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => r.unregister()));
              }
              if ('caches' in window) {
                caches.keys().then((ks) => ks.forEach((k) => caches.delete(k)));
              }
            }, []);
            return null;
          }
          """
          open(p, 'w', encoding='utf-8').write(s.strip() + "\n")
          EOF

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./liuyao-main
          file: ./liuyao-main/Dockerfile
          push: true
          tags: ghcr.io/womendejinian/yeheliuyao:latest
