name: Docker Image CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip package
        run: |
          for z in *.zip; do unzip -q -o "$z"; done
          sed -i 's/devIndicators: false,/devIndicators: false, typescript: { ignoreBuildErrors: true },/' liuyao-main/next.config.ts
          sed -i 's/body.thinking = { type: cfg.thinking };/\/\/ disabled thinking param/' liuyao-main/lib/readings/llm-request.ts

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./liuyao-main
          file: ./liuyao-main/Dockerfile
          push: true
          tags: ghcr.io/womendejinian/yeheliuyao:latest
